name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
      council: ${{ steps.filter.outputs.council }}
      faculty: ${{ steps.filter.outputs.faculty }}
      frontend: ${{ steps.frontend_matrix.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            app:
              - 'frontend/app/**'
            council:
              - 'frontend/council-app/**'
            faculty:
              - 'frontend/faculty/**'
      # `matrix` isn't available in a job-level `if`, so build the frontend
      # matrix here from only the apps that changed.
      - name: Build frontend matrix
        id: frontend_matrix
        run: |
          items=()
          [[ "${{ steps.filter.outputs.app }}" == "true" ]] && items+=('{"name":"student","dir":"frontend/app"}')
          [[ "${{ steps.filter.outputs.council }}" == "true" ]] && items+=('{"name":"council","dir":"frontend/council-app"}')
          [[ "${{ steps.filter.outputs.faculty }}" == "true" ]] && items+=('{"name":"faculty","dir":"frontend/faculty"}')
          echo "frontend=[$(IFS=,; echo "${items[*]}")]" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend — lint & validate
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prisma validate
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      - name: Proposal tests
        run: npm run test:proposal
      - name: Security audit
        run: npm audit --audit-level=high || true

  frontend:
    name: Build — ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.frontend != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.frontend) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: Install
        run: npm ci
        working-directory: ${{ matrix.dir }}
      - name: Build
        run: npm run build
        working-directory: ${{ matrix.dir }}
        env:
          NEXT_PUBLIC_SERVER_ADDRESS: https://eventio.somaiya.edu
      - name: Security audit
        run: npm audit --audit-level=high || true
        working-directory: ${{ matrix.dir }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  ci-success:
    name: CI gate
    needs: [changes, backend, frontend, codeql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.backend.result }}" \
            "${{ needs.frontend.result }}" \
            "${{ needs.codeql.result }}"; do
            case "$result" in
              failure|cancelled)
                echo "Required job failed: $result"
                exit 1
                ;;
            esac
          done
          echo "CI gate passed"

name: Deploy Production

# Disabled auto-run: production deploys via Coolify UI / coolify-redeploy.yml webhook
# (no teammate SSH). Keep workflow_dispatch only for emergency admin use.
on:
  workflow_dispatch:
    inputs:
      services:
        description: "Services to deploy (all|backend|app|council|faculty|comma-list)"
        required: false
        default: all
      sha:
        description: "Optional git SHA to deploy (default: current main HEAD)"
        required: false
        default: ""
      skip_rollback:
        description: "Disable auto-rollback on health failure"
        type: boolean
        required: false
        default: false

concurrency:
  group: eventio-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  statuses: write

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
      council: ${{ steps.filter.outputs.council }}
      faculty: ${{ steps.filter.outputs.faculty }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
              - 'deploy/**'
            app:
              - 'frontend/app/**'
            council:
              - 'frontend/council-app/**'
            faculty:
              - 'frontend/faculty/**'

  deploy:
    name: Deploy to SWDC over SSH
    needs: changes
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://eventio.somaiya.edu
    timeout-minutes: 45
    steps:
      - name: Resolve deploy targets
        id: targets
        run: |
          set -euo pipefail
          SERVICES="${{ github.event.inputs.services || 'all' }}"
          backend=0; app=0; council=0; faculty=0

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$SERVICES" == "all" ]]; then
              backend=1; app=1; council=1; faculty=1
            else
              IFS=',' read -ra parts <<< "$SERVICES"
              for p in "${parts[@]}"; do
                case "$(echo "$p" | tr -d ' ')" in
                  backend) backend=1 ;;
                  app|student) app=1 ;;
                  council) council=1 ;;
                  faculty) faculty=1 ;;
                  all) backend=1; app=1; council=1; faculty=1 ;;
                esac
              done
            fi
          else
            [[ "${{ needs.changes.outputs.backend }}" == "true" ]] && backend=1
            [[ "${{ needs.changes.outputs.app }}" == "true" ]] && app=1
            [[ "${{ needs.changes.outputs.council }}" == "true" ]] && council=1
            [[ "${{ needs.changes.outputs.faculty }}" == "true" ]] && faculty=1
          fi

          if [[ $backend$app$council$faculty == 0000 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "backend=$backend"
            echo "app=$app"
            echo "council=$council"
            echo "faculty=$faculty"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        if: steps.targets.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EVENTIO_DEPLOY_HOST }}
          username: ${{ secrets.EVENTIO_DEPLOY_USER }}
          key: ${{ secrets.EVENTIO_DEPLOY_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            export DEPLOY_BACKEND='${{ steps.targets.outputs.backend }}'
            export DEPLOY_APP='${{ steps.targets.outputs.app }}'
            export DEPLOY_COUNCIL_APP='${{ steps.targets.outputs.council }}'
            export DEPLOY_FACULTY_APP='${{ steps.targets.outputs.faculty }}'
            export EVENTIO_DEPLOY_SHA='${{ github.event.inputs.sha || github.sha }}'
            export AUTO_ROLLBACK='${{ github.event.inputs.skip_rollback == true && '0' || '1' }}'
            export DEPLOY_ENVIRONMENT=production
            export DEPLOY_ENVIRONMENT_URL=https://eventio.somaiya.edu
            export PUBLIC_BASE_URL=https://eventio.somaiya.edu
            export NEXT_PUBLIC_SERVER_ADDRESS=https://eventio.somaiya.edu
            export EVENTIO_REPO_DIR=/vm-storage/projects/eventio-3.0
            cd "$EVENTIO_REPO_DIR"
            bash scripts/deploy.sh

      - name: Post-deploy public smoke
        if: steps.targets.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for url in \
            "https://eventio.somaiya.edu/api/v1/health" \
            "https://eventio.somaiya.edu/login" \
            "https://eventio.somaiya.edu/council/login" \
            "https://eventio.somaiya.edu/faculty/login"; do
            echo "Checking $url"
            curl -fsS --max-time 20 "$url" >/dev/null
          done

  build-images:
    name: Build & push images (GHCR)
    needs: deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eventio-backend:latest
            ghcr.io/${{ github.repository_owner }}/eventio-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Student app image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/app
          file: ./frontend/app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eventio-app:latest
            ghcr.io/${{ github.repository_owner }}/eventio-app:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SERVER_ADDRESS=https://eventio.somaiya.edu
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Council app image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/council-app
          file: ./frontend/council-app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eventio-council-app:latest
            ghcr.io/${{ github.repository_owner }}/eventio-council-app:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SERVER_ADDRESS=https://eventio.somaiya.edu
          cache-from: type=gha,scope=council-app
          cache-to: type=gha,scope=council-app,mode=max
      - name: Faculty app image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/faculty
          file: ./frontend/faculty/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eventio-faculty:latest
            ghcr.io/${{ github.repository_owner }}/eventio-faculty:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SERVER_ADDRESS=https://eventio.somaiya.edu
          cache-from: type=gha,scope=faculty
          cache-to: type=gha,scope=faculty,mode=max

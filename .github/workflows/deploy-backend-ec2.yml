name: Deploy backend to EC2

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.backend.yml"
      - ".github/workflows/deploy-backend-ec2.yml"
  workflow_dispatch:

concurrency:
  group: eventio-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.EC2_APP_DIR }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            docker compose -f docker-compose.backend.yml build --pull backend
            docker compose -f docker-compose.backend.yml up -d --no-deps backend
            docker image prune -f
            curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8000/api/v1/health

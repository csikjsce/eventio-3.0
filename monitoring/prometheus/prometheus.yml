global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: eventio-api
    metrics_path: /metrics
    static_configs:
      - targets: ["10.0.25.1:3500"]
        labels:
          service: api

  - job_name: eventio-synthetics
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://eventio.somaiya.edu/api/v1/health
          - https://eventio.somaiya.edu/login
          - https://eventio.somaiya.edu/council/login
          - https://eventio.somaiya.edu/faculty/login
          - https://grafana.arnabbhowmik.in/login
          - https://prometheus.arnabbhowmik.in/-/healthy
          - https://alerts.arnabbhowmik.in/-/healthy
          - https://cicd.arnabbhowmik.in/health
          - https://npm.arnabbhowmik.in
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

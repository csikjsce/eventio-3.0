global:
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "csi-kjsce@somaiya.edu"
  smtp_auth_username: "csi-kjsce@somaiya.edu"
  smtp_auth_password_file: /etc/alertmanager/smtp_password
  smtp_require_tls: true

route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 20s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    email_configs:
      - to: "arnab.b@somaiya.edu"
        send_resolved: true
        headers:
          Subject: "[Eventio] {{ .Status | toUpper }} {{ .CommonLabels.alertname }}"
